<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}PromoPost{% endblock %}</title>
  <style>
    :root { --cor: #1f6feb; --borda: #d0d7de; --fundo: #f6f8fa; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--fundo); color: #1f2328; }
    header { background: #fff; border-bottom: 1px solid var(--borda); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    header a { color: var(--cor); text-decoration: none; font-weight: 600; }
    header form { margin-left: auto; }
    main { max-width: 860px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; }
    .card img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 12px; background: #ddf4ff; }
    .msg { background: #dafbe1; border: 1px solid #aceebb; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .msg.warning { background: #fff8c5; border-color: #eac54f; }
    form p { display: flex; flex-direction: column; gap: 4px; }
    input, select, textarea { padding: 8px; border: 1px solid var(--borda); border-radius: 6px; font: inherit; }
    button, .btn { background: var(--cor); color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; font: inherit; cursor: pointer; text-decoration: none; }
    button.pequeno, .btn.pequeno { padding: 6px 12px; font-size: 14px; }
    .btn.secundario { background: #fff; color: var(--cor); border: 1px solid var(--borda); }
    .btn.perigo, button.perigo { background: #cf222e; }
    .acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .acoes form { margin: 0; }
    .erro { color: #cf222e; font-size: 14px; }
    .secao { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .secao.alerta { border-color: #eac54f; background: #fffbea; }
    .secao h2 { margin: 0 0 8px; font-size: 18px; }
    .meses { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .meses h1 { margin: 0; font-size: 22px; text-transform: capitalize; text-align: center; }
    .dia { margin-bottom: 16px; }
    .dia:last-child { margin-bottom: 0; }
    .dia h3 { margin: 0 0 6px; font-size: 15px; text-transform: capitalize; }
    .dia.hoje h3::after { content: " · hoje"; color: var(--cor); text-transform: none; }
    .postagem { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--borda); }
    .postagem:first-of-type { border-top: 0; }
    .postagem img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .postagem .hora { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 44px; }
    .postagem .info { flex: 1; min-width: 0; }
    .tag.instagram { background: #fde2f3; }
    .tag.facebook { background: #dbe7ff; }
    .tag.publicada { background: #dafbe1; }
    .tag.erro { background: #ffebe9; }
    .tag.na-hora { background: #fff1b8; font-weight: 600; }
    .legenda { width: 100%; margin-top: 6px; font-size: 14px; }
    .vazio { color: #59636e; }
  </style>
</head>
<body>
  <header>
    <strong>PromoPost</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'lista_promocoes' %}">Promoções</a>
      <a href="{% url 'nova_promocao' %}">Nova promoção</a>
      <a href="{% url 'calendario' %}">Calendário</a>
      <a href="{% url 'admin:index' %}">Admin</a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="pequeno">Sair</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
