{% extends "admin/base_site.html" %}
{% block breadcrumbs %}
<div class="breadcrumbs">
  <a href="{% url 'admin:index' %}">Início</a> ›
  <a href="{% url 'admin:posts_comercio_changelist' %}">Comércios</a> › QR codes
</div>
{% endblock %}
{% block content %}
<p>Cada QR code abre a página da loja no site. Baixe a imagem e use onde quiser (arte da loja, Instagram, balcão).</p>
<div style="display:flex;flex-wrap:wrap;gap:24px;margin-top:16px">
  {% for item in lojas %}
    <figure style="margin:0;width:200px">
      <div style="background:#fff;padding:6px;border-radius:10px;border:1px solid #ddd">{{ item.svg }}</div>
      <figcaption style="margin-top:8px">
        <strong>{{ item.loja.nome }}</strong><br>
        <a class="button" href="{{ item.png }}" style="display:inline-block;margin-top:6px">Baixar PNG</a><br>
        <small style="color:#666;word-break:break-all">{{ item.destino }}</small>
      </figcaption>
    </figure>
  {% endfor %}
</div>
{% endblock %}
