<a class="card{% if p.destaque %} destaque{% endif %}" href="{{ p.comercio.get_absolute_url }}#promo-{{ p.pk }}">
  <img src="{{ p.imagem.url }}" alt="{{ p.titulo }}" loading="lazy">
  <div class="selos">
    {% if p.destaque %}<span class="selo">Destaque</span>{% endif %}
    {% if p.acaba_hoje %}<span class="selo hoje">Acaba hoje</span>{% endif %}
  </div>
  <div class="corpo">
    <h3>{{ p.titulo }}</h3>
    {% include "vitrine/_preco.html" %}
    <span class="loja">{{ p.comercio.nome }} · {{ p.comercio.get_cidade_display }}</span>
    <span class="validade">Válida até {{ p.fim|date:"d/m" }}</span>
  </div>
</a>
