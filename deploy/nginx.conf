# Instalado em /etc/nginx/sites-available/achoupromo pelo instalar.sh.
# O certbot (https.sh) acrescenta sozinho a parte do HTTPS.

upstream achoupromo {
    server unix:/run/achoupromo/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name achoupromo.com.br www.achoupromo.com.br _;

    # Fotos das promoções podem ser grandes (foto do celular).
    client_max_body_size 15M;

    location /static/ {
        alias /srv/achoupromo/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/achoupromo/media/;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://achoupromo;
    }
}
