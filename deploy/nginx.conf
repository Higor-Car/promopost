# Instalado em /etc/nginx/sites-available/achoupromo pelo instalar.sh.
# O certbot (https.sh) acrescenta sozinho a parte do HTTPS neste arquivo.
# O resto da configuração fica em nginx-geral.conf e nginx-locais.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name achoupromo.com.br www.achoupromo.com.br _;

    include snippets/achoupromo-locais.conf;
}
