# Instalado em /etc/nginx/conf.d/achoupromo.conf pelo instalar.sh (contexto http).

# Não anunciar a versão do nginx nas respostas.
server_tokens off;

# Login do admin: no máximo 10 tentativas por minuto por IP (contra robôs testando senhas).
limit_req_zone $binary_remote_addr zone=achoupromo_login:10m rate=10r/m;
limit_req_status 429;

upstream achoupromo {
    server 127.0.0.1:8000 fail_timeout=0;
}
