# Instalado em /etc/nginx/snippets/achoupromo-locais.conf pelo instalar.sh.
# Fica separado do arquivo do site porque o certbot (HTTPS) edita aquele arquivo;
# assim as atualizações continuam chegando depois do HTTPS ligado.

# Fotos das promoções podem ser grandes (foto do celular).
client_max_body_size 15M;

location /static/ {
    alias /srv/achoupromo/static/;
    expires 30d;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
}

location /media/ {
    alias /srv/achoupromo/media/;
    expires 7d;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
}

location = /favicon.ico { access_log off; log_not_found off; return 204; }

location = /admin/login/ {
    limit_req zone=achoupromo_login burst=5 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_pass http://achoupromo;
}

location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_pass http://achoupromo;
}
